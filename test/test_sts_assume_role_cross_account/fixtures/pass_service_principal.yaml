AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  PASS: trust policy is assumed by an AWS service principal (Lambda), not a
  cross-account IAM principal.
Resources:
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: "lambda.amazonaws.com"
            Action: "sts:AssumeRole"
