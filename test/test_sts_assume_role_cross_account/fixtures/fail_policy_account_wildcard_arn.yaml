AWSTemplateFormatVersion: "2010-09-09"
Resources:
  AccountWildcardAssumePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: "sts:AssumeRole"
            Resource: "arn:aws:iam::*:role/SomeRole"
