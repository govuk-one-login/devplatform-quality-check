AWSTemplateFormatVersion: "2010-09-09"
Resources:
  FailPolicyNoCondition:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: "iam:PassRole"
            Resource: "*"
  FailPolicyWrongCondition:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: "iam:PassRole"
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestedRegion: "eu-west-2"
