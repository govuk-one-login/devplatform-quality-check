AWSTemplateFormatVersion: "2010-09-09"
Resources:
  PassPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Deny
            Action: "iam:CreateUser"
            Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/ExampleRole"
