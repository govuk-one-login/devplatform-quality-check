AWSTemplateFormatVersion: "2010-09-09"
Resources:
  FailPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: "iam:CreateRole"
            Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/ExampleRole"
